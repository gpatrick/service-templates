[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-client"
version = "0.1.0"
description = "Async clients for the Accounts and Payments services"
requires-python = ">=3.10"
# client-core is NOT on an index; install it from a local path alongside
# this package. See SETUP.md.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# fastapi is here rather than in `dependencies` because the client package
# itself never imports it. Only examples/fastapi_app.py does,
# and that is a demonstration rather than part of the library. Putting fastapi
# in `dependencies` would force a web framework on a consuming project that is
# not a web service.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fastapi>=0.110",
    "pydantic-settings>=2.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Only needed to regenerate models from samples.
codegen = [
    "genson>=1.2",
    "datamodel-code-generator>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# "error" first: any warning not exempted below fails the test run. That means
# a new deprecation from httpx or pydantic breaks the build the day it appears
# rather than the day it becomes a removal, which is the cheaper day to deal
# with it. The exemptions are therefore a visible inventory of what we are
# deferring, and the list should get shorter over time, not longer.
#
# Each ignore matches a specific MESSAGE rather than a whole category or
# module. A blanket "ignore::DeprecationWarning" would also hide the warnings
# we want, and the module field does not work for these two: both fire at
# import time, where the reported module is the importer rather than the
# emitter. Message matching is a regex anchored at the start of the message.
filterwarnings = [
    "error",
    # Starlette's TestClient warns that httpx2 is preferred. We cannot act on
    # it: this package depends on httpx, and installing httpx2 alongside it
    # would be the bigger problem. The class is a UserWarning subclass, not a
    # DeprecationWarning, which is why category matching alone misses it.
    # Revisit when upgrading fastapi or starlette.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:",
    # anyio renamed an internal alias. Emitted while importing
    # starlette.testclient, not by anything we call.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
