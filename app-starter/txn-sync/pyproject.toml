[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txn-sync"
version = "0.1.0"
description = "Scheduled ETL job: read transactions from a source system, post them to a destination system"
requires-python = ">=3.10"

# service-client is NOT listed here as a version from an index, because it is
# not published to one. Install it alongside this project from a local path or
# a git URL; see the README. Listing it as a bare name would make `pip install .`
# fail with a confusing "no matching distribution" on the client's machine.
#
# httpx and pydantic are declared even though service-client already brings
# them, because this package imports both directly. A dependency you import
# must be a dependency you declare, or the day service-client drops one, this
# package breaks with an ImportError that names the wrong project.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
txn-sync = "txn_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# Same policy as service-client: any warning that is not explicitly exempted
# fails the run, so a new deprecation breaks the build the day it appears
# rather than the day it becomes a removal. The exemption list is an inventory
# of what is being deferred and should shrink over time.
filterwarnings = ["error"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# client-core ships a py.typed marker, so it type checks properly.
# service-client does not yet; add one there the same way if you want real
# checking against AccountsClient and PaymentsClient.
[[tool.mypy.overrides]]
module = ["service_client.*", "service_client"]
ignore_missing_imports = true

# The job's core must not import either proprietary adapter. That is the
# property that makes it testable without a network and portable to the
# client's machine, and it is easy to break with a convenience import.
# tests/test_layering.py enforces it; this section is only a reminder that
# the rule exists.
